<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>新点小工具 V1.02 界面预览</title>
    <link rel="stylesheet" href="assets/plugin-content.css?v=v102">
    <style>
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { background: transparent; }
      #ep-tool-panel { right: 40px; bottom: 30px; }
      .preview-oa-page {
        background: #fff;
        border: 1px solid #d7dde8;
        border-radius: 8px;
        height: 470px;
        opacity: 0.65;
        position: absolute;
        right: 18px;
        top: 22px;
        width: 560px;
      }
      .preview-oa-page::before {
        border-bottom: 1px solid #e5eaf2;
        content: "";
        height: 48px;
        left: 0;
        position: absolute;
        right: 0;
        top: 0;
      }
      .preview-oa-lines { display: grid; gap: 14px; padding: 78px 34px 30px; }
      .preview-oa-lines i { background: #eef2f7; border-radius: 4px; height: 20px; }
      .preview-oa-lines i:nth-child(2n) { margin-left: 68px; }
      #preview-data { position: absolute; left: -10000px; width: 800px; }
    </style>
    <script src="preview.js?v=v102" defer></script>
    <script src="assets/plugin-preview-runtime.js?v=v102" defer></script>
  </head>
  <body>
    <div class="preview-oa-page" aria-hidden="true">
      <div class="preview-oa-lines"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <div id="preview-data" aria-hidden="true" inert></div>
  </body>
</html>
